<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Product | softies Online Toy Store in India"><title>Product | softies</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="section"><div class="container" id="productDetail"></div><div class="container section"><h2>Related Products</h2><div class="grid products" id="relatedProducts"></div></div></main><div id="site-footer"></div><script src="js/products.js"></script><script src="js/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let id=+new URLSearchParams(location.search).get("id"),p=products.find(x=>x.id===id)||products[0],q=1;document.title=p.name+" | softies";const draw=()=>productDetail.innerHTML=`<div class="product-detail"><div class="detail-image"><img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.parentElement.classList.add('image-fallback')"></div><div><div class="badge">${p.category}</div><h1>${p.name}</h1><div class="rating">★ ${p.rating} (${p.reviews} reviews)</div><p class="price">${money(p.price)} <span class="old">${money(p.oldPrice)}</span> <span class="discount">${p.discount}% OFF</span></p><p>${p.description}</p><p><b>Age:</b> ${p.age}<br><b>Brand:</b> ${p.brand}<br><b>SKU:</b> ${p.sku}<br><b>Stock:</b> ${p.stock>0?p.stock+" available":"Out of stock"}</p><div class="qty"><button id="minus">−</button><span id="qtyNum">${q}</span><button id="plus">+</button></div><p><button class="btn btn-primary" id="add">Add to Cart</button> <button class="btn btn-outline" id="buy">Buy Now</button> <button class="btn btn-outline" onclick="toggleWishlist(${p.id})">♡ Wishlist</button></p><div class="panel"><b>Safety Information</b><p class="muted">Use under appropriate adult supervision. Follow age guidance and keep packaging away from small children.</p></div></div></div>`;draw();document.addEventListener("click",e=>{if(e.target.id==="minus"){q=Math.max(1,q-1);draw()}if(e.target.id==="plus"){q=Math.min(p.stock||1,q+1);draw()}if(e.target.id==="add")addToCart(p.id,q);if(e.target.id==="buy"){addToCart(p.id,q);location.href="checkout.html"}});renderProducts("#relatedProducts",products.filter(x=>x.category===p.category&&x.id!==p.id).slice(0,4))})</script></body></html>
