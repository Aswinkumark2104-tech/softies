<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Shop | softies Online Toy Store in India"><title>Shop | softies</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main><section class="page-hero"><div class="container"><h1>Shop Toys</h1><p class="muted">Find the perfect toy for every little dreamer.</p></div></section><div class="container"><div class="filters"><input id="search" placeholder="Search toys..."><select id="category"><option value="">All Categories</option></select><select id="price"><option value="">Any Price</option><option value="500">Under ₹500</option><option value="1000">Under ₹1,000</option></select><select id="rating"><option value="">Any Rating</option><option value="4">4★ & above</option><option value="4.5">4.5★ & above</option></select><select id="age"><option value="">Any Age</option><option>3-6 Years</option><option>6-10 Years</option></select><select id="sort"><option value="new">Sort: Newest</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="rate">Rating</option><option value="featured">Featured</option><option value="best">Best Sellers</option></select></div><p id="resultCount" class="muted"></p><div class="grid products" id="shopProducts"></div></div></main><div id="site-footer"></div><script src="js/products.js"></script><script src="js/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let cat=new URLSearchParams(location.search).get("category")||"";category.innerHTML+= [...new Set(products.map(p=>p.category))].map(c=>`<option>${c}</option>`).join("");category.value=cat;const run=()=>{let a=[...products],q=search.value.toLowerCase();a=a.filter(p=>(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q))&&(!category.value||p.category===category.value)&&(!price.value||p.price<=+price.value)&&(!rating.value||p.rating>=+rating.value)&&(!age.value||p.age===age.value));if(sort.value==="low")a.sort((x,y)=>x.price-y.price);if(sort.value==="high")a.sort((x,y)=>y.price-x.price);if(sort.value==="rate")a.sort((x,y)=>y.rating-x.rating);if(sort.value==="featured")a=a.filter(p=>p.featured);if(sort.value==="best")a=a.filter(p=>p.bestSeller);resultCount.textContent=`${a.length} products found`;renderProducts("#shopProducts",a)};[search,category,price,rating,age,sort].forEach(x=>x.addEventListener("input",run));run()})</script></body></html>
