<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Order Success | softies Online Toy Store in India"><title>Order Success | softies</title><link rel="stylesheet" href="css/style.css"></head><body><div id="site-header"></div><main class="section"><div class="container"><div class="empty" id="success"><div style="font-size:4rem">🎉</div><h1>Order Placed Successfully!</h1><p>Thank you for choosing softies.</p></div></div></main><div id="site-footer"></div><script src="js/products.js"></script><script src="js/main.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{let o=JSON.parse(sessionStorage.getItem("toylandLastOrder")||"null");if(o)success.innerHTML=`<div style="font-size:4rem">🎉</div><h1>Order Placed Successfully!</h1><p>Order ID: <b>${o.orderId}</b></p><p>Payment: ${o.paymentMethod}</p><h2>${money(o.total)}</h2><p class="muted">Our delivery team will contact you if required.</p><p><a class="btn btn-primary" href="shop.html">Continue Shopping</a> <a class="btn btn-outline" href="index.html">Back to Home</a></p>`;else success.innerHTML=`<h1>Track Your Order</h1><p class="muted">Enter an Order ID and phone number in the production version. Demo orders are available in the admin dashboard.</p><a class="btn btn-primary" href="shop.html">Shop Now</a>`})</script></body></html>
